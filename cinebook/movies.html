    <!-- MOVIES PAGE FIX -->
    <style>

        /* =====================================================
           REMOVE OLD CINEBOOK HERO FROM MOVIES PAGE
        ===================================================== */

        body.movies-page-body {
            background-image: none !important;
            background-color: #080a11 !important;
        }


        body.movies-page-body::before,
        body.movies-page-body::after {
            content: none !important;
            display: none !important;
            background: none !important;
            background-image: none !important;
        }


        body.movies-page-body .hero-section,
        body.movies-page-body .hero-background,
        body.movies-page-body .hero-gradient,
        body.movies-page-body .hero-content {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            background: none !important;
            background-image: none !important;
        }


        body.movies-page-body .all-movies-page {
            background-image: none !important;
        }


        body.movies-page-body .all-movies-page::before,
        body.movies-page-body .all-movies-page::after {
            content: none !important;
            display: none !important;
            background: none !important;
            background-image: none !important;
        }



        /* =====================================================
           MENU BUTTON
        ===================================================== */

        body.movies-page-body > .menu-button {
            position: fixed !important;

            top: 18px !important;
            left: 20px !important;

            width: 42px !important;
            height: 42px !important;

            display: flex !important;
            align-items: center !important;
            justify-content: center !important;

            border: 1px solid rgba(255,255,255,0.12) !important;
            border-radius: 9px !important;

            background: rgba(7,9,16,0.90) !important;
            color: #ffffff !important;

            font-size: 22px !important;

            cursor: pointer !important;

            z-index: 5000 !important;

            transition: 0.3s ease !important;
        }


        body.movies-page-body > .menu-button:hover {
            background: #e50914 !important;
            border-color: #e50914 !important;
            transform: translateY(-2px) !important;
        }



        /* =====================================================
           SIDEBAR
           IMPORTANT:
           THIS IS THE LEFT SLIDE-OUT MENU
        ===================================================== */

        body.movies-page-body > .sidebar {

            position: fixed !important;

            top: 0 !important;
            left: 0 !important;

            width: 280px !important;
            max-width: 280px !important;

            height: 100vh !important;
            max-height: 100vh !important;

            margin: 0 !important;

            padding: 25px 18px !important;

            box-sizing: border-box !important;

            background:
                linear-gradient(
                    180deg,
                    rgba(12,14,23,0.98),
                    rgba(5,7,12,0.98)
                ) !important;

            border-right: 1px solid rgba(255,255,255,0.08) !important;

            box-shadow:
                15px 0 50px rgba(0,0,0,0.45) !important;

            z-index: 4000 !important;

            transform: translateX(-100%) !important;

            transition:
                transform 0.35s ease !important;

            overflow-x: hidden !important;
            overflow-y: auto !important;
        }


        /* SIDEBAR OPEN */

        body.movies-page-body > .sidebar.active {
            transform: translateX(0) !important;
        }



        /* =====================================================
           SIDEBAR HEADER
        ===================================================== */

        body.movies-page-body .sidebar-header {

            width: 100% !important;

            min-height: 60px !important;

            display: flex !important;

            align-items: center !important;

            justify-content: space-between !important;

            gap: 10px !important;

            margin: 0 0 25px 0 !important;

            padding: 5px 5px 25px !important;

            box-sizing: border-box !important;

            border-bottom:
                1px solid rgba(255,255,255,0.08) !important;
        }



        /* =====================================================
           SIDEBAR LOGO
        ===================================================== */

        body.movies-page-body .sidebar-logo {

            width: 150px !important;
            max-width: 150px !important;

            height: 45px !important;

            display: flex !important;

            align-items: center !important;

            overflow: hidden !important;
        }


        body.movies-page-body .sidebar-logo img {

            width: 150px !important;
            max-width: 150px !important;

            height: auto !important;

            display: block !important;

            object-fit: contain !important;

            position: relative !important;
        }



        /* =====================================================
           CLOSE BUTTON
        ===================================================== */

        body.movies-page-body .close-sidebar {

            width: 35px !important;
            min-width: 35px !important;

            height: 35px !important;

            margin-left: auto !important;

            border: none !important;

            border-radius: 8px !important;

            background:
                rgba(255,255,255,0.06) !important;

            color: #ffffff !important;

            font-size: 23px !important;

            cursor: pointer !important;

            transition: 0.3s ease !important;
        }


        body.movies-page-body .close-sidebar:hover {
            background: #e50914 !important;
        }



        /* =====================================================
           SIDEBAR NAVIGATION
        ===================================================== */

        body.movies-page-body > .sidebar .sidebar-nav {

            width: 100% !important;

            display: flex !important;

            flex-direction: column !important;

            gap: 7px !important;

            margin: 0 !important;

            padding: 0 !important;
        }



        /* =====================================================
           SIDEBAR NAVIGATION ITEMS
        ===================================================== */

        body.movies-page-body > .sidebar .nav-item {

            width: 100% !important;
            max-width: 100% !important;

            min-height: 48px !important;
            height: 48px !important;

            display: flex !important;

            align-items: center !important;

            gap: 14px !important;

            padding: 0 15px !important;
            margin: 0 !important;

            box-sizing: border-box !important;

            border-radius: 9px !important;

            color: #aeb5c2 !important;

            text-decoration: none !important;

            transition: 0.25s ease !important;
        }


        body.movies-page-body > .sidebar .nav-item span {

            width: 25px !important;
            min-width: 25px !important;

            text-align: center !important;

            font-size: 18px !important;
        }


        body.movies-page-body > .sidebar .nav-item p {

            margin: 0 !important;

            font-size: 13px !important;

            font-weight: 700 !important;

            white-space: nowrap !important;
        }


        body.movies-page-body > .sidebar .nav-item:hover {

            background:
                rgba(229,9,20,0.10) !important;

            color: #ffffff !important;

            transform: translateX(4px) !important;
        }


        body.movies-page-body > .sidebar .nav-item.active {

            background:
                rgba(229,9,20,0.15) !important;

            color: #ffffff !important;

            border-left:
                3px solid #e50914 !important;
        }



        /* =====================================================
           SIDEBAR DIVIDER
        ===================================================== */

        body.movies-page-body > .sidebar .sidebar-divider {

            width: calc(100% - 10px) !important;

            height: 1px !important;

            margin: 15px 5px !important;

            background:
                rgba(255,255,255,0.08) !important;
        }



        /* =====================================================
           SIDEBAR BOTTOM
        ===================================================== */

        body.movies-page-body > .sidebar .sidebar-bottom {

            width: 100% !important;

            margin-top: 30px !important;

            padding: 18px !important;

            box-sizing: border-box !important;

            border-radius: 10px !important;

            background:
                rgba(255,255,255,0.035) !important;

            text-align: center !important;
        }


        body.movies-page-body > .sidebar .sidebar-bottom p {

            margin: 0 !important;

            color: #687283 !important;

            font-size: 10px !important;

            line-height: 1.5 !important;
        }



        /* =====================================================
           SIDEBAR OVERLAY
        ===================================================== */

        body.movies-page-body > .sidebar-overlay {

            position: fixed !important;

            inset: 0 !important;

            width: 100vw !important;
            height: 100vh !important;

            margin: 0 !important;

            padding: 0 !important;

            background:
                rgba(0,0,0,0.65) !important;

            z-index: 3900 !important;

            opacity: 0 !important;

            visibility: hidden !important;

            pointer-events: none !important;

            transition: 0.3s ease !important;
        }


        body.movies-page-body > .sidebar-overlay.active {

            opacity: 1 !important;

            visibility: visible !important;

            pointer-events: auto !important;
        }



        /* =====================================================
           MOVIES BRAND LOGO
        ===================================================== */

        body.movies-page-body .movies-brand img {

            width: 180px !important;

            max-width: 180px !important;

            height: auto !important;
        }



        /* =====================================================
           MOVIE POSTERS
        ===================================================== */

        body.movies-page-body .movie-poster img {

            width: 100% !important;

            height: 100% !important;

            object-fit: cover !important;
        }



        /* =====================================================
           MOVIES CONTENT
           MUST NOT MOVE WHEN SIDEBAR OPENS
        ===================================================== */

        body.movies-page-body .all-movies-page {

            margin-left: 0 !important;
        }



        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            body.movies-page-body > .menu-button {

                top: 17px !important;
                left: 15px !important;

                width: 40px !important;
                height: 40px !important;
            }


            body.movies-page-body > .sidebar {

                width: 260px !important;
                max-width: 260px !important;
            }


            body.movies-page-body .sidebar-logo,
            body.movies-page-body .sidebar-logo img {

                width: 145px !important;
                max-width: 145px !important;
            }


            body.movies-page-body .movies-brand img {

                width: 150px !important;
                max-width: 150px !important;
            }

        }

    </style>

</head>


<body class="movies-page-body">

         JAVASCRIPT
    ===================================================== -->

    <script src="data/movies.js"></script>

    <script src="js/auth.js"></script>

    <script src="js/movies.js"></script>



    <!-- =====================================================
         SIDEBAR JAVASCRIPT
    ===================================================== -->

    <script>

        /* =================================================
           GET ELEMENTS
        ================================================= */

        const menuButton =
            document.getElementById("menuButton");

        const sidebar =
            document.getElementById("sidebar");

        const closeSidebar =
            document.getElementById("closeSidebar");

        const sidebarOverlay =
            document.getElementById("sidebarOverlay");



        /* =================================================
           OPEN SIDEBAR
        ================================================= */

        menuButton.addEventListener(
            "click",
            function () {

                sidebar.classList.add("active");

                sidebarOverlay.classList.add("active");

            }
        );



        /* =================================================
           CLOSE SIDEBAR
        ================================================= */

        closeSidebar.addEventListener(
            "click",
            function () {

                sidebar.classList.remove("active");

                sidebarOverlay.classList.remove("active");

            }
        );



        /* =================================================
           CLICK OUTSIDE SIDEBAR
        ================================================= */

        sidebarOverlay.addEventListener(
            "click",
            function () {

                sidebar.classList.remove("active");

                sidebarOverlay.classList.remove("active");

            }
        );



        /* =================================================
           ESCAPE KEY
        ================================================= */

        document.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Escape") {

                    sidebar.classList.remove("active");

                    sidebarOverlay.classList.remove("active");

                }

            }
        );



        /* =================================================
           LOGOUT
        ================================================= */

        const logoutLink =
            document.getElementById("logoutLink");


        if (logoutLink) {

            logoutLink.addEventListener(
                "click",
                function (event) {

                    event.preventDefault();

                    if (typeof logout === "function") {

                        logout();

                    } else {

                        localStorage.removeItem(
                            "cinebookLoggedIn"
                        );

                        localStorage.removeItem(
                            "cinebookCurrentUser"
                        );

                        window.location.href =
                            "login.html";

                    }

                }
            );

        }

    </script>
